# ==============================================================================
# PermitIQ by Aureon — Render Blueprint (100% Free Tier Configuration)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API Service (Node.js 20 / Express / Socket.IO) - FREE TIER ($0/mo)
  # ----------------------------------------------------------------------------
  - type: web
    name: permitiq-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_AI_STUDIO_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: PINECONE_INDEX
        value: permitiq
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: METRICS_API_KEY
        generateValue: true
      # Database connection: TiDB Serverless (Free Forever: 5GB, 50M RU/mo) or Aiven Free MySQL
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://permitiq.codealgo.live,https://permitiq-web.onrender.com
      - key: FRONTEND_URL
        value: https://permitiq.codealgo.live
      - key: CORS_ALLOWED_ORIGINS
        value: https://permitiq.codealgo.live,https://permitiq-web.onrender.com

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Service (Next.js 15) - FREE TIER ($0/mo)
  # ----------------------------------------------------------------------------
  - type: web
    name: permitiq-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://permitiq-api.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://permitiq-api.onrender.com
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        value: rzp_live_T3nKfhlTGJh6TO
