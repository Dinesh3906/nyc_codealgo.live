apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: permit-iq-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - host: api.permit-iq.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: permit-iq-api-service
            port:
              number: 8000
