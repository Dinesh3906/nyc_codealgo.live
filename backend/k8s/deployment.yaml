apiVersion: apps/v1
kind: Deployment
metadata:
  name: permit-iq-api
  labels:
    app: permit-iq-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permit-iq-api
  template:
    metadata:
      labels:
        app: permit-iq-api
    spec:
      containers:
      - name: permit-iq-api
        image: permit-iq-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            cpu: "1.0"
            memory: 1024Mi
          requests:
            cpu: "0.5"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permit-iq-worker
  labels:
    app: permit-iq-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: permit-iq-worker
  template:
    metadata:
      labels:
        app: permit-iq-worker
    spec:
      containers:
      - name: permit-iq-worker
        image: permit-iq-api:latest
        command: ["celery", "-A", "workers.tasks.celery_app", "worker", "--loglevel=info"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            cpu: "2.0"
            memory: 2048Mi
          requests:
            cpu: "1.0"
            memory: 1024Mi
