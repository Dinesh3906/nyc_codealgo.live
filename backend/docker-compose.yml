services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-permitiq}
      DB_PASS: ${DB_PASS:?Set DB_PASS before starting compose}
      DB_NAME: ${DB_NAME:-permitiq}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET before starting compose}
      GOOGLE_AI_STUDIO_KEY: ${GOOGLE_AI_STUDIO_KEY:?Set GOOGLE_AI_STUDIO_KEY before starting compose}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY before starting compose}
      PINECONE_API_KEY: ${PINECONE_API_KEY:?Set PINECONE_API_KEY before starting compose}
      PINECONE_INDEX: ${PINECONE_INDEX:-permitiq}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID before starting compose}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET before starting compose}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID before starting compose}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET before starting compose}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS before starting compose}
      METRICS_API_KEY: ${METRICS_API_KEY:?Set METRICS_API_KEY before starting compose}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - scratch:/app/scratch
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-permitiq}
      MYSQL_USER: ${DB_USER:-permitiq}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS before starting compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting compose}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
  scratch:
